[[mutant]]
id = "xmemrchr-signed-compare"
function = "xmemrchr"
original = "    if (((uint8_t *)src)[len] == c) {"
mutated = "    if (((char *)src)[len] == c) {"
why = "byte read as (signed) char: bytes >= 0x80 never match c. NOTE: WP also rejects the equivalent control xmemrchr-char-view-control, so this kill comes from Typed+Cast keeping char and uint8 memory apart; the real signedness test is xmemrchr-int8-c"
expect = "caught"
result = "caught (but see xmemrchr-char-view-control: Typed+Cast also rejects the equivalent char view, so this kill is not semantic evidence); Proved goals:   17 / 20"

