# Planted bugs for the Frama-C WP proof of the memory.c string helpers (independent review).
# Each `original` occurs exactly once in the wp/build.py output for commit 7b87ce8 and is
# C code, not ACSL. Run: python3 -I run_mutants.py <neovim checkout> 60 (WP on the mutated
# function only, same options as wp/run_wp.sh with -wp-par 2). `expect` is the reviewer's
# prediction: "caught" (some goal not proved) or "equivalent" (same behavior on the
# documented domain, so the proof must still go through). `result` is the observed outcome.

[[mutant]]
id = "xmemcpyz-nul-off-by-one"
function = "xmemcpyz"
original = "  ((char *)dst)[len] = NUL;"
mutated = "  ((char *)dst)[len - 1] = NUL;"
why = "terminator written over the last copied byte (and at dst[-1] when len == 0)"
expect = "caught"
result = "caught; Proved goals:    7 / 11"

[[mutant]]
id = "xstrnlen-plus-one"
function = "xstrnlen"
original = "  return (size_t)(end - s);"
mutated = "  return (size_t)(end - s) + 1;"
why = "length counts the NUL (classic strlen/size confusion)"
expect = "caught"
result = "caught; Proved goals:    9 / 11"

[[mutant]]
id = "xstrchrnul-past-nul"
function = "xstrchrnul"
original = "(char *)(str + strlen(str));"
mutated = "(char *)(str + strlen(str) + 1);"
why = "not-found result points one past the NUL instead of at it"
expect = "caught"
result = "caught; Proved goals:   11 / 12"

[[mutant]]
