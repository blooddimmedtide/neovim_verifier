[[mutant]]
id = "xstrlcat-trunc-overflow"
function = "xstrlcat"
original = "    memmove(dst + dlen, src, dsize - dlen - 1);"
mutated = "    memmove(dst + dlen, src, dsize - dlen);"
why = "truncating copy moves one byte too many (dsize - dlen). Reviewer mispredicted 'caught': in this branch slen >= dsize - dlen, so the extra byte read is src[dsize-dlen-1] (inside the string) and the extra byte written is dst[dsize-1] (in bounds), which the next statement overwrites with NUL. Same behavior, so WP proving it is correct"
expect = "equivalent"
result = "survived (equivalent); Proved goals:   26 / 26"

[[mutant]]
id = "xstrlcat-return-truncated"
function = "xstrlcat"
original = "  return slen + dlen;  // Does not include NUL."
mutated = "  return MIN(slen + dlen, dsize - 1);  // Does not include NUL."
why = "returns the length actually stored instead of the would-be length (breaks truncation detection)"
expect = "caught"
result = "caught; Proved goals:   26 / 27"

[[mutant]]
id = "xstrlcat-ge-boundary"
function = "xstrlcat"
original = "  if (slen > dsize - dlen - 1) {"
mutated = "  if (slen >= dsize - dlen - 1) {"
why = "exact fit takes the truncating branch: copies slen bytes then writes NUL at dst[dsize-1] == dst[dlen+slen], same result"
expect = "equivalent"
result = "survived (equivalent); Proved goals:   26 / 26"

