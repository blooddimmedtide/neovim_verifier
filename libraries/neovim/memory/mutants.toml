[[mutant]]
id = "xmemrchr-char-view-control"
function = "xmemrchr"
original = "    if (((uint8_t *)src)[len] == c) {"
mutated = "    if (((char *)src)[len] == (char)c) {"
why = "CONTROL, semantically equivalent (both sides as signed char: equal iff same byte). Tests whether xmemrchr-signed-compare is caught for its semantics or only because Typed+Cast keeps char and uint8 memory in separate chunks. Expected caught = Typed+Cast incompleteness, not a real bug"
expect = "caught"
result = "caught (Typed+Cast incompleteness on the char/uint8 view switch; a control, not a bug); Proved goals:   17 / 20"

[[mutant]]
id = "xmemrchr-int8-c"
function = "xmemrchr"
original = "    if (((uint8_t *)src)[len] == c) {"
mutated = "    if (((uint8_t *)src)[len] == (int8_t)c) {"
why = "signedness bug kept in the uint8 memory view: c >= 0x80 becomes negative and never matches (replaces xmemrchr-signed-compare as the real signedness test)"
expect = "caught"
result = "caught; Proved goals:   18 / 20"
