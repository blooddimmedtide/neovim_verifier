# Planted bugs chosen by an independent adversarial reviewer (see REVIEW.md).
# Each must make the WP proof of its function fail: python3 -I wp/run_mutants.py <tree> 20

[[mutant]]
id = "fki-1"
function = "find_key_item"
file = "src/nvim/option.c"
old = "(p == src || *(p - 1) == ',') && strncmp"
new = "strncmp"
note = "drops the item-start check: matches the key in the middle of an item (\"xa:1\" found for key \"a:\")"

[[mutant]]
id = "fki-2"
function = "find_key_item"
file = "src/nvim/option.c"
old = "strncmp(p, key, (size_t)keylen)"
new = "strncmp(p, key, (size_t)keylen - 1)"
note = "off-by-one: compares without the ':' so key \"ab:\" matches item \"abc:1\""

[[mutant]]
id = "fki-3"
function = "find_key_item"
file = "src/nvim/option.c"
old = "end = p + strlen(p);"
new = "end = p + strlen(p) - 1;"
note = "off-by-one length for the last item (no ',' after it)"

