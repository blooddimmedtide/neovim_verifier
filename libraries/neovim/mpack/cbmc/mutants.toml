# Planted bugs for src/mpack/mpack_core.c (Neovim 7b87ce8), chosen by the independent reviewer.
# Each `original` occurs exactly once in the upstream file. `harnesses` (optional) is the ONLY=
# regex tried first (cheap harness); if the mutant survives it, every harness is run.

# ---------------------------------------------------------------- reader: first byte / tables
[[mutant]]
id = "rt-fixmap-bound"
function = "mpack_rtoken"
original = "} else if (t < 0x90) {"
mutated = "} else if (t < 0x8f) {"
why = "0x8f (fixmap 15) decoded as fixarray"
expect = "caught"
result = "caught"   # first failing ONLY=h_rtoken|h_wtoken|h_tokbuf_init

