[[mutant]]
id = "proc-final-add"
function = "sha256_process"
original = "ctx->state[5] += F;"
mutated = "ctx->state[5] += G;"
why = "feed-forward adds the wrong working variable"
checks = ["structure", "cbmc"]
expect = "caught"
result = "caught (check_structure: statement 95)"

[[mutant]]
id = "proc-macro-redefined-later"
function = "sha256_process"
original = "#define S3(x) (ROTR(x, 6) ^ ROTR(x, 11) ^ ROTR(x, 25))"
mutated = "#define S3(x) (ROTR(x, 6) ^ ROTR(x, 11) ^ ROTR(x, 26))"
original2 = "static uint8_t sha256_padding[SHA256_BUFFER_SIZE] = {"
mutated2 = "#undef S3\n#define S3(x) (ROTR(x, 6) ^ ROTR(x, 11) ^ ROTR(x, 25))\nstatic uint8_t sha256_padding[SHA256_BUFFER_SIZE] = {"
why = "adversarial: the body uses a wrong Sigma1, a correct S3 is re-#defined after the function; h_prims sees only the last definition and check_structure drops #define lines unread"
checks = ["structure", "cbmc", "difftest"]
expect = "survives"
result = "survives check_structure and all of run_cbmc.sh [difftest: caught, self-test fails]"

[[mutant]]
id = "proc-comment-splice"
function = "sha256_process"
original = "  ctx->state[6] += G;\n  ctx->state[7] += H;"
mutated = "  ctx->state[6] += G;  // and H, below: \\\n  ctx->state[7] += H;"
why = "adversarial: a // comment ending in a backslash swallows the next line in C (translation phase 2); check_structure strips // comments before splicing lines, so it still sees state[7] += H"
checks = ["structure", "cbmc", "difftest"]
expect = "survives"
result = "survives check_structure and all of run_cbmc.sh [difftest: caught, self-test fails]"

# ---------------- sha256_update ----------------
[[mutant]]
id = "upd-carry-le"
function = "sha256_update"
original = "if (ctx->total[0] < length) {"
mutated = "if (ctx->total[0] <= length) {"
why = "spurious carry into the high word of the byte count"
checks = ["stream"]
extra = "-DNO_BLOCK_CHECK -DNO_TAIL_CHECK"
expect = "caught"
result = "caught (byte count) [-DNO_BLOCK_CHECK -DNO_TAIL_CHECK]"

[[mutant]]
id = "upd-fill-off-by-one"
function = "sha256_update"
original = "size_t fill = SHA256_BUFFER_SIZE - left;"
mutated = "size_t fill = SHA256_BUFFER_SIZE - left - 1;"
why = "the partial buffer is completed with one byte too few"
checks = ["stream"]
extra = "-DNO_BLOCK_CHECK"
expect = "caught"
result = "caught (every complete block processed; the rest is buffered; only whole blocks) [-DNO_BLOCK_CHECK]"

[[mutant]]
id = "upd-tail-offset"
function = "sha256_update"
original = "memcpy(ctx->buffer + left, input, length);"
mutated = "memcpy(ctx->buffer, input, length);"
why = "the remaining tail is stored at offset 0, overwriting bytes already buffered"
checks = ["stream"]
extra = "-DNO_BLOCK_CHECK"
expect = "caught"
result = "caught (the rest is buffered) [-DNO_BLOCK_CHECK]"

[[mutant]]
id = "upd-input-step-63"
function = "sha256_update"
original = "    input += SHA256_BUFFER_SIZE;"
mutated = "    input += SHA256_BUFFER_SIZE - 1;"
why = "loop advances the input by 63 bytes per block (overlapping blocks)"
checks = ["stream"]
extra = "-DNO_BLOCK_CHECK -DNO_TAIL_CHECK"
expect = "caught"
result = "caught (loop invariant after step) [-DNO_BLOCK_CHECK -DNO_TAIL_CHECK]"

[[mutant]]
id = "upd-skip-buffer-block"
function = "sha256_update"
original = "    sha256_process(ctx, ctx->buffer);\n"
mutated = "    (void)0;\n"
why = "the completed buffer block is never compressed"
checks = ["stream"]
extra = "-DNO_BLOCK_CHECK -DNO_TAIL_CHECK"
expect = "caught"
result = "caught (loop invariant before entry; every complete block processed) [-DNO_BLOCK_CHECK -DNO_TAIL_CHECK]"

[[mutant]]
id = "upd-state-scribble"
function = "sha256_update"
original = "size_t fill = SHA256_BUFFER_SIZE - left;"
mutated = "size_t fill = SHA256_BUFFER_SIZE - left;\n  ctx->state[7] += left;"
why = "gap probe: update changes the chaining state outside sha256_process; no harness asserts anything about ctx->state"
checks = ["stream", "difftest"]
extra = "-DNO_BLOCK_CHECK -DNO_TAIL_CHECK"   # the dropped asserts only read bytes, which this mutant does not change
expect = "survives"
result = "survives h_update (proved) [-DNO_BLOCK_CHECK -DNO_TAIL_CHECK] [difftest: caught, self-test fails]"

# ---------------- sha256_finish ----------------
[[mutant]]
id = "fin-pad-0x01"
function = "sha256_finish"
original = "  0x80, 0,"
mutated = "  0x01, 0,"
why = "padding starts with 0x01 instead of the 1 bit 0x80"
checks = ["finish"]
expect = "caught"
result = "caught (block = padded stream)"

[[mutant]]
id = "fin-padn-le56"
function = "sha256_finish"
original = "(last < 56) ? (56 - last)"
mutated = "(last <= 56) ? (56 - last)"
why = "boundary: with 56 bytes buffered no padding bytes are added (no 0x80)"
checks = ["finish"]
expect = "caught"
result = "caught (all padded blocks processed; block = padded stream)"

[[mutant]]
id = "fin-bitlen-shift"
function = "sha256_finish"
original = "(ctx->total[0] >> 29)"
mutated = "(ctx->total[0] >> 28)"
why = "wrong carry of the byte count into the high word of the bit length"
checks = ["finish"]
expect = "caught"
result = "caught (block = padded stream)"

[[mutant]]
id = "fin-msglen-swapped"
function = "sha256_finish"
original = "  PUT_UINT32(high, msglen, 0);\n  PUT_UINT32(low,  msglen, 4);"
mutated = "  PUT_UINT32(high, msglen, 4);\n  PUT_UINT32(low,  msglen, 0);"
why = "64-bit length written low word first"
checks = ["finish"]
expect = "caught"
result = "caught (block = padded stream)"

[[mutant]]
id = "fin-digest-word"
