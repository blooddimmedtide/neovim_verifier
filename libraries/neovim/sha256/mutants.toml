original = "#define S0(x) (ROTR(x, 7) ^ ROTR(x, 18) ^  SHR(x, 3))"
mutated = "#define S0(x) (ROTR(x, 7) ^ ROTR(x, 18) ^  ROTR(x, 3))"
why = "sigma0 rotates instead of shifting by 3 (classic confusion)"
checks = ["structure", "cbmc"]
expect = "caught"
result = "caught (h_prims S0 = sigma0, h_sched)"

