# Planted bugs for the CBMC proof of src/nvim/sha256.c (independent review, 2026-11-02).
# Each `original` occurs exactly once in src/nvim/sha256.c at commit 7b87ce8.
# Run: python3 -I run_mutants.py <neovim checkout>   (IDS=a,b to run a subset; writes
# mutants_result.tsv only for a full run).
# `checks` names the proof scripts run on the mutated copy (one CBMC process at a time):
#   structure = cbmc/check_structure.py, cbmc = cbmc/run_cbmc.sh (h_forms ... h_endian),
#   finish = cbmc/run_finish.sh, bytes = cbmc/run_bytes.sh,
#   stream = cbmc/run_stream.sh (EXTRA from `extra`; "" is the full ~25 min proof),
#   difftest = difftest/difftest.py <nv> 2000 (native, not a proof; shown for contrast).
# `expect`: "caught" (some proof check fails) or "survives" (a real gap the reviewer
# predicts; see REVIEW.md). `result` = what the proof checks did (difftest in brackets).

# ---------------- sha256_process ----------------
[[mutant]]
id = "proc-k20"
function = "sha256_process"
original = "R(20), 0x2DE92C6F"
mutated = "R(20), 0x2DE92C6E"
why = "one bit wrong in the round-20 constant"
checks = ["structure", "cbmc"]
expect = "caught"
result = "caught (check_structure: statement 46, K)"

[[mutant]]
id = "proc-Sigma1-rot26"
function = "sha256_process"
original = "#define S3(x) (ROTR(x, 6) ^ ROTR(x, 11) ^ ROTR(x, 25))"
mutated = "#define S3(x) (ROTR(x, 6) ^ ROTR(x, 11) ^ ROTR(x, 26))"
why = "wrong rotation amount in Sigma1"
checks = ["structure", "cbmc"]
expect = "caught"
result = "caught (h_prims S3 = Sigma1, h_round)"

[[mutant]]
id = "proc-sigma0-shr-as-rotr"
