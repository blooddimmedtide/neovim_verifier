mutated = "  (n) = ((uint32_t)(b)[(i) + 3] << 24) \\\n        | ((uint32_t)(b)[(i) + 2] << 16) \\\n        | ((uint32_t)(b)[(i) + 1] <<  8) \\\n        | ((uint32_t)(b)[(i)]); \\"
