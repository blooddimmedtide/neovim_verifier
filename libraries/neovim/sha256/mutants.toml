original = "PUT_UINT32(ctx->state[6], digest, 24);"
mutated = "PUT_UINT32(ctx->state[5], digest, 24);"
why = "digest word 6 copied from state[5]"
checks = ["finish"]
expect = "caught"
result = "caught (digest = state, big-endian)"

[[mutant]]
id = "fin-state-scribble"
function = "sha256_finish"
original = "  uint32_t last = ctx->total[0] & 0x3F;"
mutated = "  uint32_t last = ctx->total[0] & 0x3F;\n  ctx->state[0] ^= last;"
why = "gap probe: finish changes the chaining state before padding; the recorder never compares the state it is handed with the state before"
checks = ["finish", "difftest"]
expect = "survives"
result = "survives h_finish (proved) [difftest: caught, self-test fails]"

