# Planted bugs chosen by the independent reviewer (see ../REVIEW.md).
# Each mutant is an exact text replacement on the file build.py extracts
# (upstream mode from the pinned Neovim, fixed mode from verified_neovim 76c51e8).
# Run: ONLY='^<harness>$' [MODE=fixed] bash run_cbmc.sh <tree> <mutated.c>
# result = what the shipped proof does (both char signednesses).

[[mutant]]
id = "m01"
harness = "h_unpack_string"
mode = "upstream"
description = "success: data not advanced past payload"
old = """
  (*data) = data2 + tok.length;"""
new = """
  (*data) = data2;"""
expected = "caught"
result = "caught"

[[mutant]]
id = "m02"
harness = "h_unpack_string"
mode = "upstream"
description = "bin8/16/32 rejected"
old = """
tok.type != MPACK_TOKEN_STR && tok.type != MPACK_TOKEN_BIN"""
new = """
tok.type != MPACK_TOKEN_STR"""
expected = "caught"
result = "caught"

[[mutant]]
id = "m03"
harness = "h_unpack_string"
mode = "upstream"
description = "EOF from reader not treated as failure"
old = """
