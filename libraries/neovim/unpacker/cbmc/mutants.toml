[[mutant]]
id = "m17"
harness = "h_push_additional_data"
mode = "fixed"
description = "previously stored item bytes zeroed (frame violation)"
old = """
  kv_concat_len(*ad, data, size);
}"""
new = """
  if (kv_size(*ad) > sizeof(AdditionalData)) memset(ad->items + sizeof(AdditionalData), 0, kv_size(*ad) - sizeof(AdditionalData));
  kv_concat_len(*ad, data, size);
}"""
expected = "caught"
result = "survived"
note = "survives the shipped harness_ad.c (weakness, REVIEW issue 2/3); caught by the strengthened harness in REVIEW.md"

[[mutant]]
id = "m18"
harness = "h_push_additional_data"
mode = "fixed"
description = "first byte of a pushed item corrupted"
old = """
  kv_concat_len(*ad, data, size);
}"""
new = """
