# Planted bugs for the src/cjson/strbuf.c / strbuf.h CBMC proof, chosen by the
# independent adversarial reviewer (see REVIEW.md). Applied to the FIXED sources
# (branch claude/project-thread-gritim of verified_neovim: strbuf.c with `size_t i`,
# strbuf.h unchanged from upstream 7b87ce8).
#
# Keys: id, file (strbuf.c | strbuf.h), function, original (occurs exactly once in
# that file; run_mutants.py refuses otherwise), mutated, why, expect:
#   expect = "caught"            a real bug: some harness of cbmc/run_cbmc.sh must fail
#   expect = "equivalent: <why>"  same behaviour on every input the claim covers
# Survivors of an expect = "caught" mutant are proof gaps; REVIEW.md explains each,
# and run_mutants.py also runs review/harness_review.c (the suggested fix) on them.

# ---------------- die ----------------
[[mutant]]
id = "die-returns"
file = "strbuf.c"
function = "die"
original = "    abort();"
mutated = "    ;"
why = "die returns; every caller continues with a NULL buffer or a bad size"
expect = "caught"

# ---------------- strbuf_init ----------------
[[mutant]]
id = "init-default-size"
file = "strbuf.c"
function = "strbuf_init"
original = "        size = STRBUF_DEFAULT_SIZE;"
mutated = "        size = STRBUF_DEFAULT_SIZE + 1;"
why = "len 0 gets 1024 bytes instead of the documented 1023"
expect = "caught"

[[mutant]]
id = "init-no-nul-room"
file = "strbuf.c"
function = "strbuf_init"
original = "        size = len + 1;         /* \\0 terminator */"
mutated = "        size = len;         /* \\0 terminator */"
why = "no room for the NUL: strbuf_init(s, n) then n appends writes past the block"
expect = "caught"

[[mutant]]
id = "init-len1-default"
file = "strbuf.c"
function = "strbuf_init"
original = "    if (!len)"
mutated = "    if (len <= 1)"
why = "len 1 gets the default size instead of 2"
expect = "caught"

[[mutant]]
id = "init-overflow-le"
file = "strbuf.c"
function = "strbuf_init"
original = "    if (size < len)"
mutated = "    if (size <= len)"
why = "size == len never holds: size is 1023 > 0 or len + 1, which is <= len only after wrapping"
expect = "equivalent: size <= len iff size < len for every len (size is never equal to len)"

[[mutant]]
id = "init-reallocs-kept"
file = "strbuf.c"
function = "strbuf_init"
original = "    s->reallocs = 0;"
mutated = "    ;"
why = "reallocs keeps stack garbage; later reallocs++ can overflow"
expect = "caught"

[[mutant]]
id = "init-no-nul"
file = "strbuf.c"
function = "strbuf_init"
original = """
    strbuf_ensure_null(s);
}

strbuf_t *strbuf_new"""
mutated = """
}

strbuf_t *strbuf_new"""
why = "a fresh strbuf's buffer is not \"\" (strbuf_string on it reads garbage)"
expect = "caught"

[[mutant]]
id = "init-malloc-len"
file = "strbuf.c"
function = "strbuf_init"
original = "    s->buf = (char *)malloc(size);"
mutated = "    s->buf = (char *)malloc(len);"
why = "allocates len bytes but records len + 1 (or 1023 with malloc(0))"
expect = "caught"

