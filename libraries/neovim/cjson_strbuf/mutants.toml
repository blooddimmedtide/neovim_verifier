# ---------------- strbuf_free ----------------
[[mutant]]
id = "free-no-clear"
file = "strbuf.c"
function = "strbuf_free"
original = "        s->buf = NULL;"
mutated = "        ;"
why = "documented: a non-dynamic strbuf may be freed any number of times; this double-frees buf"
expect = "caught"

[[mutant]]
id = "free-uaf-order"
file = "strbuf.c"
function = "strbuf_free"
original = """
    if (s->buf) {
        free(s->buf);
        s->buf = NULL;
    }
    if (s->dynamic)
        free(s);
"""
mutated = """
    int dyn = s->dynamic;
    if (dyn)
        free(s);
    if (s->buf) {
        free(s->buf);
        s->buf = NULL;
    }
"""
why = "frees the struct first, then reads and writes s->buf: use after free when dynamic"
expect = "caught"

[[mutant]]
id = "free-dynamic-leak"
file = "strbuf.c"
function = "strbuf_free"
original = "    if (s->dynamic)\n        free(s);\n}"
mutated = "    if (s->dynamic > 1)\n        free(s);\n}"
why = "never frees a strbuf_new struct"
expect = "caught"

