# ---------------- strbuf_append_string ----------------
[[mutant]]
id = "append-int-index"
file = "strbuf.c"
function = "strbuf_append_string"
original = "    size_t i;"
mutated = "    int i;"
why = "the upstream bug (findings/cjson-strbuf-append-over-2gib.md): int overflow at 2^31 bytes"
expect = "caught"

[[mutant]]
id = "append-resize-short"
file = "strbuf.c"
function = "strbuf_append_string"
original = "            strbuf_resize(s, s->length + 1);"
mutated = "            strbuf_resize(s, s->length);"
why = "asks for no more room than it has: writes past the block"
expect = "caught"

[[mutant]]
id = "append-no-space-dec"
file = "strbuf.c"
function = "strbuf_append_string"
original = "        space--;"
mutated = "        ;"
why = "space never decreases: never resizes, overflows"
expect = "caught"

[[mutant]]
id = "append-space-stale"
file = "strbuf.c"
function = "strbuf_append_string"
original = "            strbuf_resize(s, s->length + 1);\n            space = strbuf_empty_length(s);"
mutated = "            strbuf_resize(s, s->length + 1);\n            space = 1;"
why = "forgets the new room: resizes on every further byte (quadratic), still correct"
expect = "equivalent: space = 1 under-estimates the room, so it resizes more often; the result (bytes, length < size) is the same; only reallocs/size differ, which the spec of append_string does not fix"

[[mutant]]
id = "append-space-early"
file = "strbuf.c"
function = "strbuf_append_string"
original = "        if (space < 1) {"
mutated = "        if (space < 2) {"
why = "resizes one byte early"
expect = "equivalent: over-allocation only; the appended bytes and length < size are unchanged"

[[mutant]]
id = "append-truncated-room"
file = "strbuf.c"
function = "strbuf_append_string"
original = "    space = strbuf_empty_length(s);\n\n    for"
mutated = "    space = (unsigned)strbuf_empty_length(s);\n\n    for"
why = "32-bit truncation of the initial room: with >= 4 GiB of room it resizes needlessly (harmless) and with room = 2^32 k it thinks there is none"
expect = "equivalent: a smaller space only makes it resize earlier (strbuf_resize(s, length + 1) never shrinks below length + 2); the result is the same"

