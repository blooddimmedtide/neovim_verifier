# ---------------- calculate_new_size ----------------
[[mutant]]
id = "cns-len-lt1"
file = "strbuf.c"
function = "calculate_new_size"
original = "    if (len <= 0)"
mutated = "    if (len < 1)"
why = "len is size_t"
expect = "equivalent: for size_t, len <= 0 iff len < 1"

[[mutant]]
id = "cns-no-nul-room"
file = "strbuf.c"
function = "calculate_new_size"
original = "    reqsize = len + 1;"
mutated = "    reqsize = len;"
why = "forgets the NUL byte"
expect = "caught"

[[mutant]]
id = "cns-shrink-ge"
file = "strbuf.c"
function = "calculate_new_size"
original = "    if (s->size > reqsize)"
mutated = "    if (s->size >= reqsize)"
why = "at size == reqsize both branches return size"
expect = "equivalent: for size == reqsize the shrink branch returns reqsize == size, and the loop also returns size"

[[mutant]]
id = "cns-shrink-off-by-one"
file = "strbuf.c"
function = "calculate_new_size"
original = "        return reqsize;"
mutated = "        return reqsize - 1;"
why = "shrinking leaves no room for the NUL"
expect = "caught"

[[mutant]]
id = "cns-threshold"
file = "strbuf.c"
function = "calculate_new_size"
original = "    if (reqsize >= SIZE_MAX / 2) {"
mutated = "    if (reqsize >= SIZE_MAX / 4) {"
why = "wrong cut-over to exact sizing (the doubling must hold up to SIZE_MAX / 2)"
expect = "caught"

[[mutant]]
id = "cns-growth-factor"
file = "strbuf.c"
function = "calculate_new_size"
original = "            newsize *= 2;"
mutated = "            newsize += newsize / 2 + 1;"
why = "1.5x growth: big enough, but not the documented size * 2^k"
expect = "caught"

[[mutant]]
id = "cns-loop-le"
file = "strbuf.c"
function = "calculate_new_size"
original = "        while (newsize < reqsize)"
mutated = "        while (newsize <= reqsize)"
why = "one doubling too many when size * 2^k == reqsize (not the least)"
expect = "caught"

[[mutant]]
id = "cns-dead-check"
file = "strbuf.c"
function = "calculate_new_size"
original = "    if (newsize < reqsize)\n        die(\"BUG: strbuf length would overflow"
mutated = "    if (0)\n        die(\"BUG: strbuf length would overflow"
why = "removes the final safety check"
expect = "equivalent: unreachable, both branches above already give newsize >= reqsize (the loop exits only then; it cannot wrap since reqsize < SIZE_MAX / 2)"

