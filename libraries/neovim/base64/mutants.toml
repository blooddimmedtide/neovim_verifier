# ---------------- gap probes: the reviewer predicts these SURVIVE the current proof ----------------

[[mutant]]
id = "G-alphabet-urlsafe"
file = "src/nvim/base64.c"
original = "0123456789+/\";"
mutated = "0123456789-_\";"
expect = "proof fails"
predicted = "survives WP: enc_char is defined as alphabet[...] (the code's own table); only the bounded CBMC `check` catches it"
why = "any input producing sextet 62 or 63, e.g. \"\\xfb\\xff\" -> \"-_8=\" instead of \"+/8=\""

[[mutant]]
id = "G-index-urlsafe"
file = "src/nvim/base64.c"
original = "['+'] = 63, ['/'] = 64,"
mutated = "['-'] = 63, ['_'] = 64,"
expect = "proof fails"
predicted = "survives WP: valid_b64 and V are defined from char_to_index (the code's own table)"
why = "\"+/8=\" rejected and \"-_8=\" accepted, contrary to RFC 4648 section 4"

[[mutant]]
id = "G-leak-on-invalid"
file = "src/nvim/base64.c"
original = "    xfree((void *)dest);"
mutated = "    (void)dest;"
expect = "proof fails"
predicted = "survives: xfree stub is `assigns \\nothing` and no contract tracks allocation, so leaks are invisible"
why = "every invalid input whose length is a multiple of 4 (e.g. \"!!!!\") leaks out_len bytes"

[[mutant]]
id = "G-use-after-free"
file = "src/nvim/base64.c"
original = "  *out_lenp = out_len;"
mutated = "  *out_lenp = out_len;\n  xfree(dest);"
expect = "proof fails"
predicted = "survives: the xfree stub does not end validity of p, so \\valid(\\result+...) still holds after the free"
why = "every valid input: the caller receives a freed pointer and xfree's it again (double free)"
