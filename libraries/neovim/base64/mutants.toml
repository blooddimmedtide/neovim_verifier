# Planted bugs for the base64.c proof, chosen by the independent adversarial reviewer
# (see REVIEW.md). Each `original` is an exact substring occurring exactly once in the
# pristine upstream file (commit 7b87ce822e6fd45a4d9993599c2854afdb0dc4dd), or, where
# tree = "fixed", in the fixed fork /home/claude/verified_neovim/src/nvim/base64.c.
#
# Extra keys (beyond id/file/original/mutated/expect/why):
#   tree      = "upstream" (default) | "fixed"
#   caught_by = which part of `prove` is expected to reject it
#   predicted = only on the gap probes (G-*): the reviewer's prediction that the
#               current proof does NOT fail, i.e. a gap that blocks gate 6.
#
# Expected outcome for every mutant: at least one command in vpipe.toml `prove` exits
# non-zero. "annotate abort" (a tool-patch or anchor text no longer matches) counts as
# caught only because it is documented here and in REVIEW.md.

# ---------------- encoder: 64-bit fast path ----------------

[[mutant]]
id = "enc64-overread"
file = "src/nvim/base64.c"
original = "  for (; src_i + 7 < src_len; src_i += 6) {"
mutated = "  for (; src_i + 6 < src_len; src_i += 6) {"
expect = "proof fails"
caught_by = "naive runner (mutate pristine, then annotate.py): annotate abort, the line is an annotation anchor; post-annotate runner (REVIEW.md R4): WP -wp-rte (rte_mem_access on s[src_i + 7] in the patched load)"
anchor_line = true
why = "src_len = 7: the 8-byte load reads s[7], one byte past the input"

[[mutant]]
id = "enc64-shift-c3"
file = "src/nvim/base64.c"
original = "    dest[out_i + 3] = alphabet[(bits_be >> 40) & 0x3F];"
mutated = "    dest[out_i + 3] = alphabet[(bits_be >> 41) & 0x3F];"
expect = "proof fails"
caught_by = "WP assert sextet m=3 / loop invariant on dest"
why = "any input of >= 8 bytes whose 4th output char differs, e.g. \"\\x00\\x00\\x01\\x00\\x00\\x00\\x00\\x00\""

[[mutant]]
id = "enc64-mask-c7"
file = "src/nvim/base64.c"
original = "    dest[out_i + 7] = alphabet[(bits_be >> 16) & 0x3F];"
mutated = "    dest[out_i + 7] = alphabet[(bits_be >> 16) & 0x1F];"
expect = "proof fails"
caught_by = "WP assert sextet m=7"
why = "8 bytes with byte 5 having bit 5 set, e.g. byte5 = 0x20: char 7 becomes 'A' instead of 'g'"

[[mutant]]
id = "enc64-step"
file = "src/nvim/base64.c"
original = "    out_i += sizeof(uint64_t);"
mutated = "    out_i += sizeof(uint64_t) - 1;"
expect = "proof fails"
caught_by = "WP loop invariant out_i == src_i / 3 * 4"
why = "any input >= 8 bytes: the 8th output char of each block is overwritten by the next block"

