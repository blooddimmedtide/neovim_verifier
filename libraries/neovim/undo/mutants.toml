# Planted bugs for the undo-file byte helpers, chosen by the independent reviewer.
# base = "fixed" means the mutant is applied to the fixed fork (blooddimmedtide/verified_neovim),
# because upstream get8ctime already fails h_read_time (the finding).
# expect_uncaught = true marks a real (non-equivalent) bug the current proof cannot see; see REVIEW.md.

[[mutant]]
id = "m01"
function = "get4c"
file = "src/nvim/fileio.c"
find = "  n = (n << 8) + (unsigned)c;\n  return (int)n;"
replace = "  n = (n << 7) + (unsigned)c;\n  return (int)n;"
harness = "h_read_4c"
equivalent = false

