# ======================= gap probe (spec strength) =======================

[[mutant]]
id = "G-concat-len-dirty-tail"
tree = "upstream"
function = "ga_concat_len"
original = 'memcpy(data + gap->ga_len, s, len);'
mutated = 'memcpy(data + gap->ga_len, s, len); if ((size_t)(gap->ga_maxlen - gap->ga_len) > len) { data[gap->ga_len + (int)len] = 1; }'
expect = "caught"
predicted = "SURVIVES today (REVIEW.md S1)"
why = "Spare room after the copy (maxlen 100, len 0, append 3 bytes): the byte after the new end, which ga_grow zeroed, becomes 1. No contract clause of ga_concat_len says what bytes [new ga_len, ga_maxlen) hold, so the current proof should pass. Callers that rely on ga_grow's zeroing (a NUL right after the text) would break. Fix: state that the tail keeps its old bytes, or is zero where the array grew, as ga_grow and ga_append_via_ptr already do."
