# Planted bugs for the garray.c proof, chosen by the independent adversarial reviewer
# (see REVIEW.md). Each `original` is an exact substring that occurs exactly once inside the
# named function's definition (from its definition line to its closing brace) in the BUILT
# file: `python3 -I wp/build.py <tree> out.c upstream|fixed` (macros expanded, tool patch
# applied, ACSL comments inserted).
#
# NOTE for the runner: run_mutants.py's function_span() currently matches the PRELUDE
# prototypes of ga_clear, ga_grow, ga_set_growsize and ga_concat_len (lines ending in ";"),
# so for those four functions it looks at the wrong text (see REVIEW.md R1). Fix it to match
# only the definition line (no trailing ";") before running these.
#
# expect = "caught": a correct proof must fail (some goal not proved).
# expect = "equivalent": the reviewer argues the mutant does not change any behaviour the
#          contract (including `exits`) talks about; it may survive.

# ======================= upstream tree =======================

[[mutant]]
id = "clear-leak-nulls-first"
tree = "upstream"
function = "ga_clear"
original = 'xfree(gap->ga_data);'
mutated = 'gap->ga_data = NULL; xfree(gap->ga_data);'
expect = "caught"
why = "Any array with ga_data != NULL: the block is leaked (xfree(NULL)). Caught by ensures vp_freelog[old vp_nfree] == old ga_data and the vp_live decrement."

[[mutant]]
id = "clear-strings-skip-last"
tree = "upstream"
function = "ga_clear_strings"
original = 'i < _gap->ga_len; i++'
mutated = 'i < _gap->ga_len - 1; i++'
expect = "caught"
why = "ga_len >= 1 with ga_data != NULL: the last string is never freed (leak) and only ga_len frees are logged. Caught by behavior items: vp_nfree == old + ga_len + 1 and the per-k freelog clause (and the vp_live count)."

