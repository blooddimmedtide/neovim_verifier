# ======================= fixed tree =======================

[[mutant]]
id = "fix-grow-exit-off-by-one"
tree = "fixed"
function = "ga_grow"
original = 'if (n > INT_MAX - gap->ga_len) {'
mutated = 'if (n >= INT_MAX - gap->ga_len) {'
expect = "caught"
why = "Growth to exactly INT_MAX items (len 10, maxlen 10, n INT_MAX - 10) exits instead of growing. The normal-return ensures are vacuous on that path (preserve_exit ensures false), so ONLY the exits clause (exits ... && n > INT_MAX - ga_len) can catch it; tests that WP really checks exits."

[[mutant]]
id = "fix-grow-half-uncapped"
tree = "fixed"
function = "ga_grow"
original = 'n = MAX(n, MIN(gap->ga_len / 2, room));'
mutated = 'n = MAX(n, gap->ga_len / 2);'
expect = "caught"
why = "The fix half-undone: len 1.5e9 full, n 1 gives len + len/2 > INT_MAX again. Caught by -wp-rte (signed overflow in ga_len + n) and the grown_fix ensures."

[[mutant]]
id = "fix-grow-room-from-maxlen"
tree = "fixed"
function = "ga_grow"
original = 'const int room = INT_MAX - gap->ga_len;'
mutated = 'const int room = INT_MAX - gap->ga_maxlen;'
expect = "caught"
why = "ga_maxlen > ga_len and the cap applies (len 2e9 - 10, maxlen 2e9, n 20: the half-length term is capped): room becomes 147483647 instead of 147483657, so ga_maxlen ends at INT_MAX - 10 instead of INT_MAX. Caught by ensures ga_maxlen == grown_fix(...)."

[[mutant]]
id = "fix-concat-strings-exit-at-boundary"
tree = "fixed"
function = "ga_concat_strings"
original = 'if (slen > SIZE_MAX - len) {'
mutated = 'if (slen >= SIZE_MAX - len) {'
expect = "equivalent"
why = "Differs only when the partial sum is exactly SIZE_MAX; then total >= SIZE_MAX, so the original also exits (later in xmallocz or a further check) and the exits clause (total >= SIZE_MAX) allows it. No normal-return behaviour changes. Expected to SURVIVE; if it is caught, the exits clause is stronger than the reviewer thinks."

[[mutant]]
