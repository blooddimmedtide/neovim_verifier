# Planted bugs for the src/xdiff/xutils.c proofs, chosen by the independent adversarial
# reviewer (see REVIEW.md). Applied to the FIXED code (/tmp/claude-0/xd/xutils_fixed.c,
# the fork's xdiff-fixed-local merge), only in functions CLAIM.md marks "proved".
#
# Keys: id, function, tool (cbmc: harness name | wp: function name for -wp-fct),
# original (must occur exactly once in xutils.c; run_mutants.py refuses otherwise),
# mutated, why, expect:
#   expect = "caught"             a real bug: the proof CLAIM.md lists must fail
#   expect = "equivalent: <why>"  same behaviour on every input the claim covers
# A survivor of an expect = "caught" mutant is a proof gap; REVIEW.md explains each.

# ---------------- xdl_bogosqrt (CBMC h_bogosqrt) ----------------
[[mutant]]
id = "bogosqrt-n-gt-1"
function = "xdl_bogosqrt"
cbmc = "h_bogosqrt"
original = "for (i = 1; n > 0; n >>= 2)"
mutated = "for (i = 1; n > 1; n >>= 2)"
why = "n = 1 gives 1, not 2 (1*1 > 1 fails)"
expect = "caught"

[[mutant]]
id = "bogosqrt-shift1"
function = "xdl_bogosqrt"
cbmc = "h_bogosqrt"
original = "for (i = 1; n > 0; n >>= 2)"
mutated = "for (i = 1; n > 0; n >>= 1)"
why = "one doubling per bit: 2^bits(n), overflows for large n"
expect = "caught"

[[mutant]]
id = "bogosqrt-add"
function = "xdl_bogosqrt"
cbmc = "h_bogosqrt"
original = "\t\ti <<= 1;\n\n\treturn i;"
mutated = "\t\ti += i;\n\n\treturn i;"
why = "i += i is i <<= 1 (i <= 2^32, no overflow)"
expect = "equivalent: doubling written as an addition"

