# Mutation testing of the marktree.c leaf-function proofs (fixed mode, WP timeout 20 s).
# Each mutant edits one function's text in a scratch copy of the Neovim tree; the copy of
# wp/build.py gets the mutant's sha256 so the build accepts it. caught = the proof fails.
# Mutant 11 is equivalent under the sortedness precondition and is expected to survive.

[[mutant]]
id = 1
function = "pos_leq"
description = "strict col compare"
original = "a.col <= b.col"
mutated = "a.col < b.col"
caught = true
tool = "frama-c-wp"
equivalent = false
evidence = "fixed pos_leq: 7 / 8; [wp] [Timeout] typed_cast_pos_leq_ensures (Qed 29ms) (Z3)"

[[mutant]]
id = 2
function = "pos_less"
description = "arguments swapped"
original = "return !pos_leq(b, a);"
mutated = "return !pos_leq(a, b);"
