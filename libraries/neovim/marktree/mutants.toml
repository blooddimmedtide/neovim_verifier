equivalent = false
evidence = "fixed pos_less: 8 / 10; [wp] [Timeout] typed_cast_pos_less_ensures (Qed 12ms) (Z3); [wp] [Timeout] typed_cast_pos_less_ensures_2 (Qed 13ms) (Z3)"

