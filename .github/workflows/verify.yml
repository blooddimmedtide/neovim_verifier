name: verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      targets:
        description: "Space-separated target names (empty = all)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  neovim:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
    env:
      USER: root
    defaults:
      run:
        shell: bash
    steps:
      - name: Base packages
        run: apt-get update -qq && apt-get install -y -qq git curl xz-utils python3 python3-pip gcc ca-certificates >/dev/null
      - uses: actions/checkout@v4
      - name: Read pinned Neovim commit
        id: pin
        run: echo "commit=$(python3 -c 'import tomllib;print(tomllib.load(open("libraries/neovim/vpipe.toml","rb"))["commit"])')" >> "$GITHUB_OUTPUT"
      - name: Fetch Neovim at the pinned commit
        run: |
          git init -q nvim-src && cd nvim-src
          git fetch -q --depth 1 https://github.com/neovim/neovim ${{ steps.pin.outputs.commit }}
          git checkout -q FETCH_HEAD
      - name: Fetch the fixed fork at its pinned commit
        run: |
          read repo commit < <(python3 -c 'import tomllib;d=tomllib.load(open("libraries/neovim/vpipe.toml","rb"));print(d["fixed_repo"], d["fixed_commit"])')
          git init -q fixed-src && cd fixed-src
          git fetch -q --depth 1 "$repo" "$commit"
          git checkout -q FETCH_HEAD
      - name: Install provers
        run: |
          bash tools/install.sh > install.log 2>&1 || { echo "::error title=install failed::$(tail -20 install.log | tr '\n' '|' | cut -c1-1500)"; exit 1; }
          tail -3 install.log
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
      - name: Prove and check
        run: python3 -I tools/run_target.py libraries/neovim nvim-src --fixed fixed-src ${{ github.event.inputs.targets }}
      - name: Status must be up to date
        run: |
          python3 -I tools/status.py libraries/neovim > /tmp/STATUS.md
          diff -u STATUS.md /tmp/STATUS.md
